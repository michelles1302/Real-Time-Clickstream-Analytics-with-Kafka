version: '3.8'

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: clickstream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'HOST://localhost:9092,DOCKER://kafka:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'DOCKER'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  init-kafka:
    image: apache/kafka:3.7.0
    container_name: clickstream-init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command:
      - |
        echo "Creating Kafka topic 'clickstream' with 3 partitions..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic clickstream --partitions 3 --replication-factor 1
        echo "Topic clickstream created successfully!"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic clickstream

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clickstream-dashboard
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=local
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - STORAGE_MODE=local
    volumes:
      - ./data:/app/data
    command: [ "streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0" ]
    depends_on:
      - kafka

networks:
  default:
    name: clickstream-network
